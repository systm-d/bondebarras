name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Relançable à la main : une manche supprimée ou un doute sur un `main` déjà
  # poussé ne doivent pas obliger à fabriquer un commit pour rien.
  workflow_dispatch:

# La CI ne fait que lire le dépôt : rien d'autre ne lui est accordé.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # En CI avec cache, les artefacts incrémentaux sont inutiles (jamais réutilisés
  # d'un run à l'autre) et alourdissent le cache : on les désactive.
  CARGO_INCREMENTAL: 0

jobs:
  lint:
    name: lint (fmt + clippy)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # Pas de linter ni de formateur Markdown ici, et ce n'est pas un oubli.
      # `docs/cli.md` cite les quatre écrans d'aide du binaire mot pour mot,
      # et `docs_cli_md_quotes_the_binarys_own_help` les compare ligne à ligne
      # à ce que `bondebarras --help` imprime. La plus longue ligne de ces
      # blocs fait aujourd'hui 196 caractères — la description de `update`,
      # dans le bloc de premier niveau : clap ne la replie pas (le projet
      # n'active pas `wrap_help`, et
      # `the_quoted_help_is_the_same_at_any_terminal_width` le vérifie), donc
      # la page ne le peut pas davantage. Un formateur à repli de prose
      # (prettier et son `--prose-wrap`, ou équivalent) replierait ce bloc et
      # rendrait ce test rouge sans que l'auteur puisse comprendre pourquoi :
      # il comparerait la page au binaire, qui lui ne replie rien.
      #
      # Un linter qui ne replie rien pose le problème plus petit : markdownlint
      # signale ces lignes (MD013) sans pouvoir les corriger, puisque les
      # raccourcir reviendrait à mentir sur ce qu'imprime le binaire.
      #
      # Si un linter Markdown est ajouté un jour : qu'il épargne les blocs
      # clôturés, ou qu'il épargne `docs/cli.md`, et que cette raison soit
      # recopiée à l'endroit de l'exclusion pour qu'elle survive à qui l'a
      # posée. La page a le droit d'être moins jolie que le linter le
      # voudrait ; elle n'a pas le droit d'être fausse.

  test:
    name: test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: ubuntu-22.04, os: ubuntu-22.04, container: "" }
          - { name: ubuntu-24.04, os: ubuntu-24.04, container: "" }
          - { name: fedora-40, os: ubuntu-24.04, container: "fedora:40" }
          - { name: fedora-41, os: ubuntu-24.04, container: "fedora:41" }
          - { name: macos-latest, os: macos-latest, container: "" }
          # Windows : une seule image, `windows-latest`, comme macOS. Les
          # deux familles Linux sont épinglées en deux versions parce qu'on
          # publie un .deb et un .rpm par génération de distribution ; rien
          # de tel côté Windows, où le binaire MSVC ne dépend pas de la
          # version de l'image. La matrice `binaries` de release.yml n'y
          # construit que `windows-x86_64`, sur `windows-latest` : la CI
          # couvre ce que la release publie, et rien de plus.
          - { name: windows-latest, os: windows-latest, container: "" }
    steps:
      - name: Install container prerequisites (Fedora)
        if: matrix.container != ''
        run: dnf -y install gcc git curl
      - uses: actions/checkout@v7
      - name: Install Rust via rustup (Fedora container)
        if: matrix.container != ''
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Install Rust (native runners)
        if: matrix.container == ''
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        if: matrix.container == ''
        with:
          key: ${{ matrix.name }}
      # Les garde-fous de documentation (#33) sont ici, et pas dans une étape
      # à eux : recensement des pages qui nomment la release, plancher de
      # hauteur de l'onglet Billing, liens et ancres relatifs. Ce sont des
      # tests Rust, donc ils tombent dans la porte locale — `cargo test
      # --workspace` — avant d'atteindre la CI, et l'auteur voit l'assertion
      # plutôt qu'un journal de manche.
      #
      # Aucun ne touche au réseau : les liens externes ne sont délibérément
      # pas suivis (la raison est écrite sur
      # `every_relative_link_and_anchor_in_the_documentation_resolves`, dans
      # `crates/bondebarras/tests/cli.rs`), pour qu'une panne chez un tiers ne
      # puisse pas rougir une manche qu'on apprendrait alors à ignorer.
      - run: cargo test --workspace --locked
        env:
          # aws-lc-sys — tiré par le backend JWT d'octocrab, qui ne signe
          # jamais rien ici — assemble son code x86-64 Windows avec NASM,
          # absent de l'image `windows-latest` : sans cette variable le build
          # s'arrête net sur « Missing dependency: nasm ». La caisse embarque
          # les objets déjà assemblés pour exactement ce cas, ce qui évite
          # d'ajouter une action tierce à la chaîne. La variable n'est lue
          # que pour une cible windows-x86_64 : elle est inerte sur les cinq
          # autres entrées de la matrice.
          AWS_LC_SYS_PREBUILT_NASM: "1"

  coverage:
    name: coverage (informational)
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-tarpaulin
      - run: cargo tarpaulin --workspace --out Xml
      - uses: codecov/codecov-action@v7
        with:
          files: cobertura.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  security:
    name: security (audit + deny)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-deny
      - run: cargo audit
      - run: cargo deny check
