<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ config.title }}{% endblock %}</title>
  <meta name="description" content="{{ config.description }}">
  <meta name="theme-color" content="{{ config.extra.brand_color }}">
  <link rel="stylesheet" href="{{ get_url(path='main.css') }}">
  <link rel="icon" href="{{ get_url(path='favicon.ico') }}" sizes="48x48">
  <link rel="icon" href="{{ get_url(path='icon-32.png') }}" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="{{ get_url(path='icon-180.png') }}">
  <meta property="og:image" content="{{ get_url(path='logo-h@2x.png') }}">
  <meta name="twitter:card" content="summary_large_image">
</head>
<body>
  {% block content %}{% endblock %}
  <footer class="footer">
    <span>bondebarras · local-first · open source ·
      <a href="{{ config.extra.repo_url }}">GitHub</a></span>
  </footer>
</body>
</html>
