{% extends "base.html" %}
{% block content %}
<header class="hero">
  <div class="topbar">
    <nav class="langswitch" aria-label="Language">
      <a href="{{ get_url(path='fr/') }}"{% if lang == 'fr' %} class="on" aria-current="true"{% endif %}>FR</a>
      <a href="{{ get_url(path='/') }}"{% if lang == 'en' %} class="on" aria-current="true"{% endif %}>EN</a>
    </nav>
  </div>
  <h1 class="hero-title">
    <img class="hero-logo" src="{{ get_url(path='logo-h.png') }}"
         alt="{{ section.extra.name }}" width="760" height="253">
  </h1>
  <p class="tagline">{{ section.extra.tagline }}</p>
  <p class="lede">{{ section.extra.lede }}</p>
  <p class="status">
    <a class="status-pill" href="{{ section.extra.status_url | safe }}">{{ section.extra.status }}</a>
    <span class="status-note">{{ section.extra.status_note }}</span>
  </p>
  <div class="cta">
    <a class="btn btn-primary" href="#install">{{ section.extra.cta2 }}</a>
    <a class="btn" href="{{ config.extra.repo_url | safe }}">{{ section.extra.cta }}</a>
  </div>
  <p class="cta-tertiary"><a href="{{ config.extra.docs_url | safe }}">{{ section.extra.cta3 }}</a></p>
</header>
<main>{{ section.content | safe }}</main>
{% endblock %}
