[workspace]
resolver = "2"
members = ["crates/bondebarras-core", "crates/bondebarras"]

[workspace.package]
edition = "2024"
rust-version = "1.88"
version = "1.0.0-rc.2"
license = "MIT OR Apache-2.0"
description = "TUI and CLI to audit and clean up GitHub organization resources: Actions caches, artifacts, workflow runs, packages, branches, tags and release assets."
repository = "https://github.com/systm-d/bondebarras"
homepage = "https://systm-d.github.io/bondebarras"
documentation = "https://systm-d.github.io/bondebarras"
readme = "README.md"
keywords = ["github", "actions", "cleanup", "tui", "devops"]
categories = ["command-line-utilities", "development-tools"]
authors = ["systm-d <k@levilainpetit.dev>"]

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
# octocrab requires a JWT backend, never used here; its default (jwt-rust-crypto) pulls rsa (RUSTSEC-2023-0071, unfixed).
octocrab = { version = "0.54", default-features = false, features = ["default-client", "follow-redirect", "retry", "rustls", "rustls-ring", "timeout", "tracing", "jwt-aws-lc-rs"] }
http = "1"
ratatui = "0.30"
crossterm = "0.29"
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
wiremock = "0.6"
assert_cmd = "2"
predicates = "3"
ureq = "3"
sha2 = "0.11"
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = true
codegen-units = 1
strip = true
