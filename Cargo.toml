[workspace]
resolver = "2"
members = ["crates/bondebarras-core", "crates/bondebarras"]

[workspace.package]
edition = "2024"
rust-version = "1.88"
version = "0.1.0"
license = "MIT OR Apache-2.0"
description = "TUI Rust pour auditer et nettoyer les ressources des organisations GitHub."
repository = "https://github.com/systm-d/bondebarras"
homepage = "https://github.com/systm-d/bondebarras"
authors = ["systm-d <k@levilainpetit.dev>"]

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
octocrab = "0.41"
ratatui = "0.30"
crossterm = "0.29"
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
wiremock = "0.6"
insta = "1"
assert_cmd = "2"
predicates = "3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = true
codegen-units = 1
strip = true
